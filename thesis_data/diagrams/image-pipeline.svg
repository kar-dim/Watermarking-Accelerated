<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="title description">
<title id="title">Image watermarking</title>
<desc id="description">Single images and folders use the same watermark code. CUDA and OpenCL run on the GPU, Eigen runs on the CPU. CUDA tries nvJPEG for supported JPEG files, CPU image libraries handle other inputs and fallback. Embedding saves an image, detection returns a correlation value. Qt supports single-image embed and detect, CLI single-image mode embeds.</desc>
